[package]
name = "qing-transfer-module"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
mdns-sd = { version = "=0.21.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
