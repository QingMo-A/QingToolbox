<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Pin __TITLE__</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}img{display:block;width:100%;height:100%;object-fit:fill;-webkit-user-drag:none}.tools{position:fixed;top:6px;right:6px;display:flex;gap:4px;padding:4px;border-radius:8px;background:#13253ad9;opacity:0;transition:opacity .15s}body:hover .tools,.tools:focus-within{opacity:1}button{border:0;border-radius:4px;padding:5px 7px;background:transparent;color:white;cursor:pointer}button:hover{background:#ffffff30}.grip{position:fixed;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 60%,#2563eb 62%,#fff 68%,#2563eb 74%)}#error{position:fixed;bottom:0;left:0;color:white;background:#b42335;font:12px sans-serif}#menu{position:fixed;background:#13253af5;border-radius:8px;padding:5px;z-index:5}#menu button{display:block;width:100%;text-align:left}
</style></head><body><img id="image" src="__IMAGE__" alt="贴图" draggable="false"><div class="tools"><button data-action="topmost" title="切换置顶">置顶 ✓</button><button data-action="aspect" title="切换缩放模式">等比例</button><button data-action="copy" title="复制图片">复制</button><button data-action="close" title="关闭">×</button></div><div class="grip" aria-label="缩放"></div><div id="error" role="alert"></div><div id="menu" hidden><button data-action="topmost">切换置顶</button><button data-action="aspect">切换等比例 / 自由缩放</button><button data-action="copy">复制图片</button><button data-action="close">关闭</button></div>
<script>
const image=document.getElementById('image'),menu=document.getElementById('menu');let locked=true;
const invoke=(action,extra={})=>window.__TAURI_INTERNALS__.invoke('control_screenpin_window',{action,...extra}).catch(e=>{document.getElementById('error').textContent=e.message||String(e);throw e});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{menu.hidden=true;try{const a=b.dataset.action;if(a==='aspect'){locked=!locked;document.querySelector('.tools [data-action="aspect"]').textContent=locked?'等比例':'自由';}else if(a==='topmost'){const v=await invoke('toggleTopmost');document.querySelector('.tools [data-action="topmost"]').textContent=v?'置顶 ✓':'置顶';}else await invoke(a);}catch{}});
image.onpointerdown=e=>{if(e.button===0){menu.hidden=true;invoke('drag').catch(()=>{});}};
document.oncontextmenu=e=>{e.preventDefault();menu.hidden=false;menu.style.left=Math.max(0,Math.min(e.clientX,innerWidth-menu.offsetWidth))+'px';menu.style.top=Math.max(0,Math.min(e.clientY,innerHeight-menu.offsetHeight))+'px';};
document.onkeydown=e=>{if(e.key==='Escape')invoke('close').catch(()=>{});if(e.ctrlKey&&e.key.toLowerCase()==='c'){e.preventDefault();invoke('copy').catch(()=>{});}};
const grip=document.querySelector('.grip');let resize=null,pending=null,sending=false;
async function flush(){if(sending||!pending)return;sending=true;const size=pending;pending=null;try{await invoke('resize',size);}catch{}finally{sending=false;if(pending)flush();}}
function update(e){if(!resize)return;let w=resize.w+(e.screenX-resize.x),h=resize.h+(e.screenY-resize.y);if(locked){w=Math.max(64,48*resize.r,Math.min(4096,4096*resize.r,w));h=w/resize.r;}pending={width:Math.round(Math.max(64,Math.min(4096,w))),height:Math.round(Math.max(48,Math.min(4096,h)))};flush();}
grip.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();resize={x:e.screenX,y:e.screenY,w:innerWidth,h:innerHeight,r:image.naturalWidth/image.naturalHeight||innerWidth/innerHeight};grip.setPointerCapture(e.pointerId);};grip.onpointermove=update;grip.onpointerup=e=>{update(e);resize=null;};grip.onpointercancel=()=>{resize=null;};
</script></body></html>
