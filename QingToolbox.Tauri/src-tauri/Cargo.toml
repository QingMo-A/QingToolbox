[package]
name = "qingtoolbox-tauri"
version = "0.1.0"
description = "Lightweight QingToolbox desktop host"
authors = ["QingMo-A"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[lib]
name = "qingtoolbox_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
