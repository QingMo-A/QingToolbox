[package]
name = "qingtoolbox-tauri"
version = "0.1.0"
description = "Lightweight QingToolbox desktop host"
authors = ["QingMo-A"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[lib]
name = "qingtoolbox_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-miniz"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Networking_WinHttp", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
