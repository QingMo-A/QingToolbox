name: Native modules validation

on:
  workflow_dispatch:
  push:
    branches: [modules]
  pull_request:
    branches: [modules]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent modules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: modules-source
      - name: Checkout compatible Rust toolbox and shared UI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: toolbox
          path: toolbox-host
      - name: Setup Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24
      - name: Verify source and metadata
        shell: pwsh
        run: ./modules-source/scripts/verify-modules.ps1 -MetadataOnly
      - name: Build and verify native modules
        shell: pwsh
        env:
          QINGTOOLBOX_MODULES_ROOT: ${{ github.workspace }}/modules-source
          QINGTOOLBOX_HOST_ROOT: ${{ github.workspace }}/toolbox-host
        run: |
          cargo --version
          ./modules-source/scripts/verify-modules.ps1 -Build -QingToolboxHostRoot "$env:QINGTOOLBOX_HOST_ROOT"
      - name: Verify host source resolution and caches
        shell: pwsh
        working-directory: toolbox-host
        run: node --test scripts/test-module-sources.mjs scripts/test-tauri-build-cache.mjs
