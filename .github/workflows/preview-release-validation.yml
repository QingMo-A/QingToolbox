name: Preview release validation

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated tag as a GitHub prerelease
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful validation run to publish without rebuilding (optional)
        required: false
        default: ""
        type: string
  pull_request:
    branches:
      - toolbox
  push:
    branches:
      - toolbox
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: preview-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preview:
    if: github.event_name != 'workflow_dispatch' || inputs.candidate_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      installer_file: ${{ steps.release.outputs.installer_file }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}

    steps:
      - name: Describe Preview validation scope
        shell: pwsh
        run: |
          Write-Host "QingToolbox Preview validation"
          Write-Host "Host-only release"
          Write-Host "No bundled modules"
          Write-Host "A GitHub Release is created only for an explicitly authorized tag dispatch"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve Preview release metadata
        id: release
        shell: pwsh
        run: |
          $metadata = ./scripts/get-preview-release-metadata.ps1
          "version=$($metadata.Version)" | Out-File $env:GITHUB_OUTPUT -Append
          "file_version=$($metadata.FileVersion)" | Out-File $env:GITHUB_OUTPUT -Append
          "runtime=$($metadata.Runtime)" | Out-File $env:GITHUB_OUTPUT -Append
          "installer_file=$($metadata.InstallerFileName)" | Out-File $env:GITHUB_OUTPUT -Append
          "manifest_file=$($metadata.ManifestFileName)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_name=$($metadata.ValidationArtifactName)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: QingToolbox.WebUI/package-lock.json

      - name: Restore WebUI
        working-directory: QingToolbox.WebUI
        shell: pwsh
        run: npm ci

      - name: Type check WebUI
        working-directory: QingToolbox.WebUI
        shell: pwsh
        run: npm run typecheck

      - name: Test WebUI
        working-directory: QingToolbox.WebUI
        shell: pwsh
        run: npm run test

      - name: Build WebUI production assets
        working-directory: QingToolbox.WebUI
        shell: pwsh
        run: npm run build

      - name: Verify WebUI asset identity
        working-directory: QingToolbox.WebUI
        shell: pwsh
        run: npm run verify-assets

      - name: Test WebUI asset tamper rejection
        shell: pwsh
        run: ./scripts/test-web-asset-integrity.ps1

      - name: Verify PowerShell 5.1 Web asset generation
        shell: pwsh
        run: ./scripts/test-web-asset-generator-compatibility.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore

      - name: Verify final HEAD PowerShell contracts
        shell: powershell
        run: ./scripts/test-preview-final-head-contracts.ps1

      - name: Build Debug
        shell: pwsh
        run: dotnet build -c Debug --no-restore

      - name: Build Release
        shell: pwsh
        run: dotnet build -c Release --no-restore

      - name: Run Web Shell smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.WebShellSmokeTest
          -c Release
          --no-build

      - name: Run Development Web Shell canary
        shell: pwsh
        run: >-
          ./scripts/test-development-web-shell.ps1
          -Configuration Release
          -NoBuild
          -TimeoutSeconds 120
          -DiagnosticsDirectory "${{ runner.temp }}\QingToolboxWebShellCanary"

      - name: Run module update smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModuleUpdateSmokeTest
          -c Release
          --no-build

      - name: Run startup reliability smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.StartupReliabilitySmokeTest
          -c Release
          --no-build

      - name: Run module package download smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModulePackageDownloadSmokeTest
          -c Release
          --no-build

      - name: Run secure module package staging smoke test
        shell: pwsh
        env:
          QMOD_STAGING_DIAGNOSTIC_PATH: ${{ runner.temp }}\QingToolboxStagingSmoke\summary.txt
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModulePackageStagingSmokeTest
          -c Release
          --no-build

      - name: Run module update transaction smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModuleUpdateTransactionSmokeTest
          -c Release
          --no-build

      - name: Run module update runtime adapter smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModuleUpdateRuntimeAdapterSmokeTest
          -c Release
          --no-build

      - name: Fetch pinned TextTools canary source
        shell: pwsh
        run: >-
          git fetch
          --no-tags
          --depth=1
          origin
          +bc0e57b5a77e3526de157d92a3d300bf3d267e8b:refs/qingtoolbox/canary/texttools/bc0e57b5a77e3526de157d92a3d300bf3d267e8b

      - name: Run Development TextTools update canary
        shell: powershell
        run: >-
          ./scripts/test-texttools-module-update-canary.ps1
          -Configuration Release
          -TargetEnvironment Both

      - name: Deploy development module for smoke test
        shell: pwsh
        run: ./scripts/deploy-dev-modules.ps1 -Configuration Release

      - name: Run module load smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project QingToolbox.DevTools.ModuleLoadSmokeTest
          -c Release
          --no-build

      - name: Verify host payload and SemVer contracts
        shell: pwsh
        run: |
          ./scripts/test-host-payload-contracts.ps1
          ./scripts/test-installer-semver.ps1
          ./scripts/test-installer-only-release-contract.ps1

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install Inno Setup 6.7.1."
          }
          $installedIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $installedIscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $installedIscc"
          }
          $sourceRoot = Split-Path -Parent $installedIscc
          $isolatedRoot = Join-Path $env:RUNNER_TEMP "InnoSetup"
          New-Item -ItemType Directory -Path $isolatedRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceRoot "*") `
            -Destination $isolatedRoot -Recurse
          $isolatedIscc = Join-Path $isolatedRoot "ISCC.exe"
          $preparedIscc = ./scripts/prepare-inno-setup.ps1 `
            -IsccPath $isolatedIscc
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup dependency preparation failed."
          }
          "ISCC_PATH=$preparedIscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Preview installer
        shell: pwsh
        run: >-
          ./scripts/build-installer.ps1
          -IsccPath $env:ISCC_PATH
          -SkipPreflight

      - name: Test installer roundtrip
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\QingToolboxProfile\LocalAppData
          APPDATA: ${{ runner.temp }}\QingToolboxProfile\AppData
          INSTALLER_FILE: ${{ steps.release.outputs.installer_file }}
        run: |
          $installerPath = Join-Path `
            "./artifacts/installer/output" $env:INSTALLER_FILE
          ./scripts/test-installer-roundtrip.ps1 `
            -InstallerPath $installerPath `
            -TestRoot "${{ runner.temp }}\QingToolboxInstallerRoundtrip" `
            -KeepTestFiles

      - name: Resolve verified v0.2.1-alpha installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $resolved = ./scripts/resolve-previous-preview-installer.ps1 `
          -Tag v0.2.1-alpha `
            -OutputDirectory "${{ runner.temp }}\QingToolboxPreview1"
          "installer=$($resolved.InstallerPath)" | Out-File $env:GITHUB_OUTPUT -Append
          "sha256=$($resolved.Sha256)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Test v0.2.1-alpha to 0.2.2-alpha in-place upgrade
        shell: pwsh
        run: |
          ./scripts/test-preview-upgrade.ps1 `
            -PreviousInstallerPath "${{ steps.previous.outputs.installer }}" `
            -CurrentInstallerPath (Join-Path "./artifacts/installer/output" "${{ steps.release.outputs.installer_file }}") `
            -TestRoot "${{ runner.temp }}\QingToolboxPreviewUpgrade" `
            -KeepTestFiles

      - name: Validate clean Preview source
        shell: pwsh
        run: ./scripts/assert-preview-source.ps1

      - name: Write Preview manifest
        shell: pwsh
        run: ./scripts/write-preview-manifest.ps1

      - name: Verify Preview assets and manifest
        shell: pwsh
        run: ./scripts/verify-preview-assets.ps1

      - name: Upload Preview validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QingToolbox-preview-validation-diagnostics-${{ github.run_number }}
          retention-days: 10
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}\QingToolboxInstallerRoundtrip\install.log
            ${{ runner.temp }}\QingToolboxInstallerRoundtrip\uninstall.log
            ${{ runner.temp }}\QingToolboxInstallerRoundtrip\diagnostics.txt
            ${{ runner.temp }}\QingToolboxPreviewUpgrade\Installer Logs With Spaces\*.log
            ${{ runner.temp }}\QingToolboxStagingSmoke\summary.txt
            ${{ runner.temp }}\QingToolboxWebShellCanary\**

      - name: Clean Preview validation test data
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            "${{ runner.temp }}\QingToolboxInstallerRoundtrip",
            "${{ runner.temp }}\QingToolboxProfile",
            "${{ runner.temp }}\QingToolboxPreviewUpgrade",
            "${{ runner.temp }}\QingToolboxPreview1",
            "${{ runner.temp }}\QingToolboxStagingSmoke",
            "${{ runner.temp }}\QingToolboxWebShellCanary"
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

      - name: Upload Preview validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          retention-days: 10
          if-no-files-found: error
          path: |
            artifacts/installer/output/${{ steps.release.outputs.installer_file }}
            artifacts/installer/output/${{ steps.release.outputs.installer_file }}.sha256
            artifacts/${{ steps.release.outputs.manifest_file }}

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.candidate_run_id == ''
    needs: validate-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require the exact release tag
        shell: bash
        env:
          VERSION: ${{ needs.validate-preview.outputs.version }}
        run: |
          expected_tag="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release publication requires the exact ${expected_tag} tag ref." >&2
            exit 1
          fi

      - name: Checkout validated release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download validated installer assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          name: ${{ needs.validate-preview.outputs.artifact_name }}
          path: release-assets

      - name: Verify the public asset pair
        shell: bash
        env:
          INSTALLER_FILE: ${{ needs.validate-preview.outputs.installer_file }}
        run: |
          installer="release-assets/installer/output/${INSTALLER_FILE}"
          sidecar="${installer}.sha256"
          test -s "${installer}"
          test -s "${sidecar}"
          asset_count="$(find release-assets/installer/output -maxdepth 1 -type f | wc -l)"
          test "${asset_count}" -eq 2
          (cd "$(dirname "${installer}")" && sha256sum --check "$(basename "${sidecar}")")

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-preview.outputs.version }}
          INSTALLER_FILE: ${{ needs.validate-preview.outputs.installer_file }}
        run: |
          installer="release-assets/installer/output/${INSTALLER_FILE}"
          sidecar="${installer}.sha256"
          gh release create "v${VERSION}" \
            "${installer}" \
            "${sidecar}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "QingToolbox ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"

  publish-validated-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.candidate_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release orchestration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify the successful candidate and release tag
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $metadata = ./scripts/get-preview-release-metadata.ps1
          $tag = "v$($metadata.Version)"
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw "Candidate run $env:CANDIDATE_RUN_ID is not successful."
          }
          $tagCommit = (git rev-parse "$tag^{}").Trim()
          if ($run.head_sha -ne $tagCommit) {
            throw "Candidate $($run.head_sha) does not match $tag at $tagCommit."
          }
          "version=$($metadata.Version)" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "installer_file=$($metadata.InstallerFileName)" | Out-File $env:GITHUB_OUTPUT -Append
          "artifact_name=$($metadata.ValidationArtifactName)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Download the successful candidate assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
        run: gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir release-assets

      - name: Verify and publish the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          TAG: ${{ steps.candidate.outputs.tag }}
          INSTALLER_FILE: ${{ steps.candidate.outputs.installer_file }}
        run: |
          installer="release-assets/installer/output/${INSTALLER_FILE}"
          sidecar="${installer}.sha256"
          test -s "${installer}"
          test -s "${sidecar}"
          asset_count="$(find release-assets/installer/output -maxdepth 1 -type f | wc -l)"
          test "${asset_count}" -eq 2
          (cd "$(dirname "${installer}")" && sha256sum --check "$(basename "${sidecar}")")
          gh release create "${TAG}" \
            "${installer}" \
            "${sidecar}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "QingToolbox ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"
