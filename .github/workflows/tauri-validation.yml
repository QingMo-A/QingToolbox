name: Tauri validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - toolbox
    paths:
      - 'QingToolbox.Tauri/**'
      - 'protocol/**'
      - 'scripts/build-tauri-*.ps1'
      - 'scripts/package-tauri-*.ps1'
      - 'scripts/smoke-tauri-*.ps1'
      - 'scripts/smoke-tauri-*.mjs'
      - 'scripts/verify-tauri.ps1'
      - 'scripts/run-tauri-latest.ps1'
      - 'scripts/test-local-environment-contracts.ps1'
      - 'scripts/test-tauri-release-candidate-contracts.ps1'
      - 'scripts/prepare-inno-setup.ps1'
      - 'run-latest.bat'
      - 'run-legacy-wpf.bat'
      - 'installer/QingToolbox.Tauri.iss'
      - 'installer/dependencies.psd1'
      - '.github/workflows/tauri-validation.yml'
  push:
    branches:
      - toolbox
    paths:
      - 'QingToolbox.Tauri/**'
      - 'protocol/**'
      - 'scripts/build-tauri-*.ps1'
      - 'scripts/package-tauri-*.ps1'
      - 'scripts/smoke-tauri-*.ps1'
      - 'scripts/smoke-tauri-*.mjs'
      - 'scripts/verify-tauri.ps1'
      - 'scripts/run-tauri-latest.ps1'
      - 'scripts/test-local-environment-contracts.ps1'
      - 'scripts/test-tauri-release-candidate-contracts.ps1'
      - 'scripts/prepare-inno-setup.ps1'
      - 'run-latest.bat'
      - 'run-legacy-wpf.bat'
      - 'installer/QingToolbox.Tauri.iss'
      - 'installer/dependencies.psd1'
      - '.github/workflows/tauri-validation.yml'

permissions:
  contents: read

concurrency:
  group: tauri-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: QingToolbox.Tauri/package-lock.json

      - name: Restore Tauri host and WebUI dependencies
        shell: pwsh
        run: |
          npm ci --prefix QingToolbox.Tauri --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Tauri npm restore failed.' }
          npm ci --prefix QingToolbox.WebUI --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'WebUI npm restore failed.' }

      - name: Setup Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install pinned Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install Inno Setup 6.7.1."
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $iscc"
          }
          $preparedIscc = ./scripts/prepare-inno-setup.ps1 -IsccPath $iscc
          if ([string]::IsNullOrWhiteSpace($preparedIscc)) {
            throw "Inno Setup dependency preparation failed."
          }
          "ISCC_PATH=$preparedIscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test Tauri release candidate gate contracts
        shell: pwsh
        run: ./scripts/test-tauri-release-candidate-contracts.ps1

      - name: Build and validate unsigned Tauri release candidate
        shell: pwsh
        env:
          QING_TAURI_DISABLE_AUTOSTART_SYNC: '1'
        run: ./scripts/build-tauri-release-candidate.ps1 -IsccPath $env:ISCC_PATH

      - name: Check formatting and repository diff
        shell: pwsh
        run: |
          cargo fmt --manifest-path QingToolbox.Tauri/src-tauri/Cargo.toml -- --check
          git diff --check
