<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qing PDF</title>
    <style>
      :root { background: #f4f8ff; }
      html, body, #app { min-height: 100%; margin: 0; }
      .boot-splash { min-height: 100vh; display: grid; place-items: center; color: #315b8f; font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .boot-card { display: grid; justify-items: center; gap: 12px; }
      .boot-mark { width: 48px; height: 48px; border-radius: 15px; background: linear-gradient(145deg, #ff6b62, #d9384f); }
      .boot-spinner { width: 22px; height: 22px; border: 3px solid #d8e4f2; border-top-color: #e84d5b; border-radius: 50%; animation: boot-spin .9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-live="polite">
        <div class="boot-card"><div class="boot-mark" aria-hidden="true"></div><strong>正在打开 Qing PDF…</strong><span class="boot-spinner" aria-hidden="true"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
