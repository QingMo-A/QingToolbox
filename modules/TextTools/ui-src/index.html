<!doctype html>
<!-- The appearance is deliberately not named here. It is selected by
     `data-appearance-preset` and `data-theme` on the root element, the host
     writes those before this page's scripts run and rewrites them whenever the
     user changes the appearance, and a value named here would be a second
     source for something the host already owns. The shared module entry supplies the
     fallback for a page opened with no host to write them. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Tools</title>
  </head>
  <body>
    <div id="app"><div class="boot-splash"><span>TT</span><strong>Text Tools</strong><small>正在准备文本工具…</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
