[package]
name = "qing-convert-module"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
pdf-extract = "=0.12.1"
docx-rs = { version = "=0.4.22", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
