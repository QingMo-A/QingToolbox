[package]
name = "qing-windowstools-module"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"
publish = false
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
sha2 = "=0.10.9"
flate2 = "=1.1.10"
winreg = "=0.55.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
