<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Web Module Canary</title></head>
<body>
  <main>
    <h1>Web Module Canary</h1>
    <p id="status">Waiting for hostReady</p>
    <p id="presentation"></p>
    <nav aria-label="Host window actions">
      <button data-action="requestShow">Show</button>
      <button data-action="requestHide">Hide</button>
      <button data-action="requestToggle">Toggle</button>
    </nav>
    <pre id="state" aria-live="polite"></pre>
  </main>
  <script>
    const status = document.getElementById('status');
    const state = document.getElementById('state');
    const presentation = document.getElementById('presentation');
    function applyPresentation(message) {
      document.documentElement.dataset.appearancePreset = message.appearancePresetId;
      document.documentElement.lang = message.languageCode;
      presentation.textContent = `Appearance: ${message.appearancePresetId}  Language: ${message.languageCode}`;
    }
    let nextId = 1;
    function invoke(method, payload) {
      const id = `canary-${nextId++}`;
      window.chrome.webview.postMessage({type:'invoke', id, method, payload});
    }
    document.querySelectorAll('[data-action]').forEach(button =>
      button.addEventListener('click', () => invoke(button.dataset.action, {})));
    window.chrome.webview.addEventListener('message', event => {
      const message = event.data;
      if (message.type === 'hostReady' && message.bridge === true) {
        status.textContent = 'Bridge ready';
        applyPresentation(message);
        invoke('getState', {});
        invoke('echo', {canary:true});
      } else if (message.type === 'presentationChanged') {
        applyPresentation(message);
      } else if (message.type === 'result' && message.ok) {
        state.textContent = JSON.stringify(message.payload);
      } else if (message.type === 'event' &&
          (message.name === 'stateChanged' || message.name === 'externalDrop')) {
        state.textContent = JSON.stringify(message.payload);
      }
    });
  </script>
</body>
</html>
